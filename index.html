<head>

<style>
:root{
  --cream:#FBF7F0; --card:#FFFDF9; --terra:#C4785A; --terra-d:#A35D42; --sage:#6F8260; --sage-d:#5C6B4F;
  --char:#2C2A28; --gray:#6B6560; --line:#E5D9C8;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--char);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--terra-d)}
.topbar{position:sticky;top:0;z-index:10;background:var(--terra);color:var(--cream);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  box-shadow:0 2px 0 var(--sage)}
.topbar h1{margin:0;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.2px}
.topbar .sub{font-family:var(--serif);font-style:italic;font-size:13px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
.search{position:relative;margin:4px 0 10px}
.search input{width:100%;font-size:16px;padding:11px 38px 11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--char);outline:none;font-family:var(--sans)}
.search input:focus{border-color:var(--terra)}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;color:var(--gray);padding:6px 8px;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--sage);color:var(--sage-d);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px;font-family:var(--sans);white-space:nowrap}
.chip.on{background:var(--sage);color:#fff}
.chip.fav.on{background:var(--terra);border-color:var(--terra);color:#fff}
.chip.fav{border-color:var(--terra);color:var(--terra-d)}
.count{font-size:13px;color:var(--gray);margin:0 2px 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.card .t{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.25;padding:8px 10px 2px}
.card .c{font-size:12px;color:var(--sage-d);padding:0 10px 10px;margin-top:auto}
.card .ph{font-size:11px;color:var(--terra-d);padding:0 10px 4px;font-style:italic}
.heart{border:0;background:rgba(251,247,240,.92);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.card .heart{position:absolute;top:8px;right:8px}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--terra-d);stroke-width:2}
.heart.on svg{fill:var(--terra)}
.empty{text-align:center;color:var(--gray);padding:40px 10px;font-family:var(--serif);font-style:italic}
/* recipe view */
.rbar{display:flex;align-items:center;gap:8px}
.back{border:0;background:none;color:var(--cream);font-size:16px;padding:4px 6px 4px 0;font-family:var(--sans);display:flex;align-items:center;gap:4px}
.rbar .sp{flex:1}
.rbar .heart{background:rgba(251,247,240,.95)}
.hero{width:100%;max-height:340px;object-fit:cover;display:block;border-radius:14px;margin:4px 0 12px;background:var(--line)}
.rtitle{font-family:var(--serif);font-size:25px;line-height:1.2;margin:0 0 6px}
.accent{height:3px;width:120px;background:var(--terra);border-radius:2px;margin:0 0 8px}
.meta{font-size:13px;color:var(--gray);margin-bottom:10px}
.wake{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:0 0 6px;font-size:14px}
.wake .sp{flex:1}
.switch{position:relative;width:46px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d8cfc2;border-radius:999px;transition:.2s}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--sage)}
.switch input:checked+span:before{transform:translateX(18px)}
h2.lbl{font-family:var(--serif);color:var(--terra-d);font-size:19px;margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
h2.lbl small{font-family:var(--sans);font-size:12px;color:var(--gray);font-weight:400;margin-left:auto}
.grp{font-weight:700;color:var(--terra-d);font-size:14px;margin:10px 0 2px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
ul.ing li .box{flex:0 0 22px;height:22px;border:2px solid var(--sage);border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center}
ul.ing li.done .box{background:var(--sage)}
ul.ing li.done .box:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);margin-top:-3px}
ul.ing li.done .txt{color:var(--gray);text-decoration:line-through}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ol.steps li .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--terra);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.nodir{color:var(--char);padding:4px 0}
.famnote{font-weight:700;font-style:italic;color:var(--terra-d);white-space:pre-line}
ul.notes{margin:0;padding-left:18px;color:var(--gray);font-style:italic;font-size:14px}
ul.notes li{margin:4px 0}
.keep{display:block;max-width:100%;border-radius:10px;border:1px solid var(--line);margin:4px auto 0}
.src{font-size:13px;color:var(--gray);margin-top:18px;padding-top:10px;border-top:1px solid var(--line);word-break:break-word}
.src a{font-weight:600}
.bigbtn{display:block;text-align:center;background:var(--terra);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;margin:14px 0 6px;font-size:16px}
.creator{font-size:14px;color:var(--gray);margin-top:6px}
.foot{text-align:center;font-family:var(--serif);font-style:italic;color:var(--gray);font-size:12px;margin-top:26px}
</style>
</head>

amily_note": "", "ingredients": ["Per jar (recipe makes 4 jars):", "1/2 cup rolled oats", "1 tbsp chia seeds", "1 scoop vanilla protein powder", "2 tbsp vanilla greek yogurt", "1/2 tbsp cashew butter (or almond butter)", "1/2 cup almond milk", "1 tsp maple syrup", "Sprinkle of salt & cinnamon", "2-3 tbsp frozen blueberries"], "instructions": ["Add the listed ingredients to each jar: rolled oats, chia seeds, vanilla protein powder, vanilla Greek yogurt, cashew or almond butter, almond milk, maple syrup, salt & cinnamon, and frozen blueberries.", "Mix it all together.", "Put in fridge overnight."], "no_directions_line": "", "notes": ["Amounts are per jar; video shows 4 jars.", "Ingredient amounts from Instagram caption.", "Tip from video: frozen blueberries add more flavor than fresh.", "Photo is a free stock stand-in (not from the original Instagram reel); original link had only creator/selfie frames."], "source_url": "https://www.instagram.com/reel/DZtDoGeCg94/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/04.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "blog-yummy-6", "title": "Healthy Carrot Cake Muffins", "category": "Breakfast", "site": "Yummy Toddler Food", "meta": {"prep_time": "10 min", "cook_time": "16 min", "total_time": "26 min", "servings": "12 (Makes 24 mini muffins or 12 servings)"}, "family_note": "", "ingredients": ["¾ cup whole-wheat flour", "½ cup rolled oats", "¼ cup brown sugar", "1 teaspoon cinnamon", "1 teaspoon baking powder", "¼ teaspoon baking soda", "¼ teaspoon salt", "1 cup applesauce", "1 cup grated carrots", "2 large eggs", "3 tablespoons canola oil (or melted coconut oil)", "1 teaspoon vanilla extract", "¼ cup raisins (I prefer golden raisins, but any kind will work)"], "instructions": ["Preheat the oven to 350 degrees F and coat a 24-cup mini muffin tin with nonstick spray.", "Add all ingredients to a medium bowl and stir together to combine thoroughly but gently.", "Add a heaping 1 tablespoon of the batter to each prepared muffin cup and bake 18-22 minutes or until lightly golden brown around the edges and a cake tester inserted into the middle comes out cleanly.", "Remove from oven, cool in the pan for 2 minutes, and use a paring knife to loosen the edges as needed. Tilt in the pan to allow air to circulate underneath or transfer to a wire rack to cool.", "Serve warm, at room temp, or chilled."], "no_directions_line": "", "notes": [], "source_url": "https://www.yummytoddlerfood.com/healthy-carrot-cake-muffins/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/05.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "blog-mary-2", "title": "Healthy Pumpkin Banana Muffins Recipe (Gluten-Free)", "category": "Breakfast", "site": "Mary's Whole Life", "meta": {"prep_time": "10 min", "cook_time": "20 min", "total_time": "30 min", "servings": "12 muffins"}, "family_note": "", "ingredients": ["2 large ripe bananas mashed", "2 eggs", "½ cup pumpkin puree", "⅓ cup coconut sugar", "1 tsp vanilla", "¼ cup ghee melted (sub coconut oil for dairy free)", "1 ½ cups gluten free 1:1 flour I like King Arthur Baking brand", "½ cup vanilla protein powder I used 2 scoops of Be Well By Kelly", "½ tsp baking soda", "1 tsp gluten free baking powder", "1 tsp cinnamon", "2 tsp pumpkin pie spice", "¾ cup dark chocolate chips optional"], "instructions": ["Preheat oven to 350. Spray a muffin pan with avocado oil.", "Mix the mashed bananas, eggs, pumpkin purée, coconut sugar, vanilla, and coconut oil together in one bowl.", "In a separate bowl, add the gluten free flour, protein powder, baking soda, baking powder, cinnamon and pumpkin pie spice. Mix well.", "Add the dry ingredients to the wet and stir until just combined. Fold in chocolate chips.", "Divide the mixture evenly between the 12 cups and bake for 18-20 minutes or until a toothpick comes out clean. Enjoy!"], "no_directions_line": "", "notes": ["Expert Tips Vegan Pumpkin Muffins: While I haven't tested this myself, you may be able to replace the eggs in this recipe with flax eggs or an egg replacement. If you try this out, let me know how they turn out in the comments! Mini Muffins: These pumpkin banana muffins really are whole-family friendly. If you want to make mini muffins for your kids, follow all the same instructions and divide the muffin batter in your mini muffin tin. Keep in mind that you will need to adjust the baking time. I recommend 10-12 minutes at 350F. No protein powder: Replace the protein powder with 2 tablespoons flaxseed meal, if desired. Storage Tips Store leftover banana pumpkin muffins in an airtight container at room temperature for up to 2 days or up to a week in the fridge. To freeze, wrap each of your cooked and cooled muffins in plastic wrap and store them in a freezer-safe container or freezer bag and store them in the freezer for up to 3 months. Thaw before serving."], "source_url": "https://www.maryswholelife.com/wprm_print/healthy-pumpkin-banana-muffins-recipe-gluten-free", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/06.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "blog-mary-1", "title": "Homemade McGriddle Muffins (Sweet & Savory Breakfast)", "category": "Breakfast", "site": "Mary's Whole Life", "meta": {"prep_time": "10 min", "cook_time": "17 min", "total_time": "27 min", "servings": "12 muffins"}, "family_note": "", "ingredients": ["1 lb ground breakfast sausage turkey or pork", "2 eggs", "2 cups gluten free protein pancake mix I used King Arthur Baking brand", "1.5 cups almond milk or milk of choice", "1.5 cups shredded cheddar cheese", "2 tbsp maple syrup + more if you like them sweeter!"], "instructions": ["Preheat oven to 375.", "Cook the breakfast sausage in a pan for 5-7 minutes, breaking it up with a wooden spoon. Drain fat and add it to a large bowl.", "Add the pancake mix, eggs, almond milk, shredded cheddar cheese, and maple syrup. Stir to combine.", "Spray a 12-cup muffin tin with avocado oil. Divide the mixture between the 12 cups, filling to the top.", "Bake for 18-20 minutes until fluffy and cooked through.", "Let them cool for 10 minutes, then remove and enjoy with more maple syrup, if desired!"], "no_directions_line": "", "notes": ["Want stronger maple flavor? Add maple extract or swirl a little syrup in the center before baking for that signature sausage McGriddle muffin flavor. Avoid dry muffins by not overmixing the batter—stir gently until everything just comes together. Test one muffin early. Gluten-free batters can vary—checking one muffin a few minutes early helps avoid overbaking the full batch. Mini muffin option: Use a mini tin and reduce bake time to about 12 minutes. Great for toddlers, snacks, or brunch buffets. For a lower fat version: Use turkey sausage and fat free cheddar cheese! No sticking, no mess: Use silicone liners or generously grease a prepared muffin pan to avoid sticky bottoms."], "source_url": "https://www.maryswholelife.com/wprm_print/homemade-mcgriddle-muffins-sweet-savory-breakfast", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/07.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-16", "title": "Overnight Breakfast Casserole (Christmas Morning)", "category": "Breakfast", "site": "brunchwithbabs", "meta": {}, "family_note": "", "ingredients": ["1 pound Italian sausage", "3/4 of a loaf brioche bread", "about 2 cups grated cheddar cheese", "8 eggs", "2 1/2 cups whole milk", "1 teaspoon dry mustard", "1 teaspoon salt"], "instructions": ["Over medium low heat, brown 1 pound Italian sausage.", "Cube 3/4 loaf brioche.", "Grate about 2 cups cheese.", "In a large bowl, over the cubed bread add the sausage and grated cheddar.", "Crack 8 eggs into a separate bowl and beat.", "To the eggs add 2 1/2 cups whole milk, 1 tsp dry mustard, 1 tsp salt.", "Pour egg mixture over bread, sausage, cheese.", "Fold together.", "Pour into a lightly greased 8 by 13 casserole dish.", "Cover with foil, refrigerate overnight.", "In the morning remove the foil.", "Bake at 350 for around 45 minutes."], "no_directions_line": "", "notes": ["Creator calls this Babs Famous Overnight Breakfast Casserole.", "Amounts and method from spoken narration and on-screen preparation in the TikTok."], "source_url": "https://www.tiktok.com/t/ZTyRs3tUe/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/08.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "family-pumpkin-pancakes", "title": "Pumpkin Pancakes", "category": "Breakfast", "site": "BLW Meals app (@blwmealsapp)", "meta": {}, "family_note": "", "ingredients": ["1 tablespoons applesauce (no sugar added) or shredded apple", "1 tablespoon of pumpkin puree (no sugar added)", "1 egg", "2 tablespoons oat flour (or amaranth or all purpose flour)", "1 tablespoon water", "A pinch of pumpkin spice or cinnamon (optional)"], "instructions": ["Mix all the ingredients together using a whisk or fork, you can also use a blender or mixer.", "Grease a non-stick frying pan with a couple drops of butter or coconut oil.", "Once the pan is heated on medium-low heat, use a medium cookie scoop (about 2 tablespoons) to pour in the batter. Make sure to spread out the batter so it is thinner on the pan. Smaller pancakes are easier to flip and cook through.", "When the bottom side starts to brown (1-2 minutes), flip it around and cook the other side (1-2 minutes)."], "no_directions_line": "", "notes": ["Note: The pancakes should be fluffy, but slightly crispy on the outside, like an omelet.", "Storage: Can be kept in the fridge for up to 3 days, or frozen for up to 3 months.", "Suitable from: 6 months + after allergens (wheat and egg) have been introduced.", "The screenshot ends after the Suitable from line, so anything below it wasn't visible.", "Food photo cropped from the BLW Meals app screenshot (stacked pancakes on a white plate); phone UI removed."], "source_url": "BLW Meals app (@blwmealsapp), from a screenshot", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/09.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "pin-4DcYNd5rU", "title": "Copycat Starbucks Banana Bread", "category": "Breads & Baked", "site": "", "meta": {}, "family_note": "", "ingredients": ["2 cups flour", "1 teaspoon baking soda", "¼ teaspoon salt", "1 egg", "1⅛ cup sugar", "½ cup vegetable or canola oil", "2 tablespoons buttermilk or milk", "½ teaspoon vanilla", "3 bananas mashed very well", "½ cup chopped walnuts (optional)"], "instructions": ["Preheat oven to 325 degrees.", "Add flour, baking soda and salt to a small bowl and set aside.", "Mix egg, sugar and oil and stir until well combined", "Add the dry ingredients to the wet and stir well. The mixture will be thick and dry.", "Next add milk, vanilla and bananas and stir until incorporated.", "Mix in walnuts and pour into a loaf pan.", "Cook 50-75 minutes, checking regularly until a knife comes out clean."], "no_directions_line": "", "notes": ["Note the success of banana bread depends on bananas. You really want super ripe or slightly brown bananas for the best flavor.", "If you want an authentic Starbucks experience, add nuts to the dough and sprinkle on top as well."], "source_url": "https://myfrugaladventures.com/2015/10/copycat-banana-bread-recipe/", "pin_it": "https://pin.it/4DcYNd5rU", "instagram_url": "", "placeholder": false, "img": "img/10.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "pin-2jFnlf3TQ", "title": "Zucchini Bread", "category": "Breads & Baked", "site": "NatashasKitchen.com", "meta": {"prep_time": "15 min", "cook_time": "60 min", "total_time": "90 min", "servings": "20 slices (makes 2 loaves)"}, "family_note": "", "ingredients": ["3 cups all-purpose flour (or use 1:1 gluten-free flour)", "1 1/2 tsp baking powder", "1 tsp baking soda", "1 tsp fine sea salt", "2 tsp ground cinnamon", "3 large eggs (room temperature)", "1 cup extra light olive oil (or canola or vegetable oil)", "1 1/2 cups granulated sugar", "1 Tbsp vanilla extract", "3 cups grated zucchini* (from 1 lb or 2 medium zucchini)", "1 cup chopped walnuts or pecans (optional**)"], "instructions": ["Prepare the pans - Preheat the oven to 350°F. Butter two 8x4-inch metal loaf pans* and line with parchment paper for easier lifting.", "Dry ingredients - In a medium mixing bowl, whisk together 3 cups of flour, 1 1/2 teaspoons of baking powder, 1 teaspoon of baking soda, 1 teaspoon of salt, and 2 teaspoons of cinnamon.", "Wet ingredients - In a separate large mixing bowl, add 3 eggs, 1 cup of oil, 1 1/2 cups sugar, and 1 tablespoon vanilla. Whisk until very well blended. Add the flour mixture to the wet ingredients and stir with a spatula just until combined. Do not overmix; the batter will be thick.", "Grate the zucchini using the large holes of a box grater. Fold in the grated zucchini and nuts, if using. The batter will look thick at first, then loosen as the zucchini is incorporated.", "Bake - Pour the batter into your prepared pans and bake in a preheated oven at 350˚F for 50-60 minutes, starting to check at 50 minutes, or until a toothpick inserted into the center comes out clean or with a few moist crumbs. Cool in the pans for 10-15 minutes, then transfer to a wire rack and cool completely to room temperature."], "no_directions_line": "", "notes": [], "source_url": "https://natashaskitchen.com/zucchini-bread-recipe/", "pin_it": "https://pin.it/2jFnlf3TQ", "instagram_url": "", "placeholder": false, "img": "img/11.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-7", "title": "5-Minute Dump & Bake Chicken Pesto", "category": "Dinner", "site": "whitneykailyn_", "meta": {}, "family_note": "", "ingredients": ["4 chicken breasts", "Salt & pepper", "Garlic powder", "Oregano", "1 jar pesto", "6–8 slices mozzarella cheese", "Optional: fresh tomato slices", "Optional: fresh basil", "Optional: balsamic glaze"], "instructions": ["Place the chicken breasts in a baking dish or sheet pan. Season generously with salt, pepper, garlic powder, and oregano.", "Spread a spoonful of pesto over each chicken breast, then dump the rest of the jar around the chicken.", "Bake at 400°F for about 30 minutes (time may vary by thickness). Chicken is ready when it reaches an internal temperature of 165°F.", "Top each chicken breast with sliced mozzarella.", "Return to the oven and bake (or broil) for 10–15 minutes, until the cheese is melted and bubbly.", "Optional: top with fresh tomato slices, fresh basil, and a drizzle of balsamic glaze."], "no_directions_line": "", "notes": ["Caption is the written recipe kept here. On-screen text in the video said bake 40 minutes at 400°F before adding cheese (caption: about 30 minutes)."], "source_url": "https://www.tiktok.com/t/ZTyRp6DJY/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/12.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-17", "title": "Brown Butter & Sage Pumpkin Gnocchi", "category": "Dinner", "site": "morganpetersonn", "meta": {}, "family_note": "", "ingredients": ["1 package Trader Joe's pumpkin gnocchi (or any brand)", "5 links apple chicken sausage (e.g. Gilbert’s Harvest Apple)", "1/2 red onion, sliced", "3-4 tbsp butter", "8-10 sage leaves, chopped", "3-4 cloves garlic", "2-3 handfuls spinach", "1/3 cup parmesan cheese", "Salt & pepper to taste"], "instructions": ["Cook pumpkin gnocchi according to package instructions in a large pot. While gnocchi are cooking, slice chicken sausage and onion.", "Once gnocchi are finished, remove from pot.", "Cook chicken sausage & onion and then set aside.", "Turn heat to medium-low and add butter. Once butter begins to bubble, add garlic and sage leaves. Continue stirring & let butter simmer until it turns slightly brown (takes 3-5ish mins).", "Turn heat off and add gnocchi, chicken sausage and onion back to the pot.", "Add 2-3 p grated Parmesan", "1 tsp Italian seasoning", "½ tsp garlic powder", "½ tsp onion powder", "¼ tsp black pepper", "1½ cups mozzarella"], "instructions": ["Preheat oven to 400°F.", "Brown Italian sausage and drain excess grease.", "Add uncooked pasta, sausage, tomatoes, and garlic to a greased 9×13.", "Add broth, cream, cream cheese or Boursin, Parmesan, and seasonings together. Pour over pasta and stir. Make sure pasta is submerged as much as possible.", "Cover tightly with foil. Bake 35–45 minutes, stirring halfway through if desired. Check that the pasta is tender. Add a little hot broth if needed.", "Add spinach and top with mozzarella. Bake uncovered another 5–10 minutes or until cheese melts and spinach wilts.", "Rest 5–10 minutes to thicken. Top with red pepper flakes if desired."], "no_directions_line": "", "notes": ["Serving size 6-8 people", "You can still make this a true dump-and-bake after browning the sausage if you have an oven-safe skillet — no need to boil the pasta separately."], "source_url": "https://www.tiktok.com/t/ZTyRgwmLH/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/18.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-11", "title": "Creamy Mushroom Orzo Dump Dinner", "category": "Dinner", "site": "mealsandmunchies", "meta": {}, "family_note": "", "ingredients": ["2 cups dry orzo", "3 1/2 cups low sodium chicken broth", "1 packet beefy onion soup mix", "1 rotisserie chicken (pre-pulled / pre-cooked)", "Mushrooms, about 1/2 cup (to taste; optional)", "Chopped spinach (to taste)", "8 ounces sour cream", "1 can cream of mushroom soup", "Shredded Parmesan cheese"], "instructions": ["To a greased 9x13 baking dish add dry orzo.", "Pour in broth.", "Season with beefy onion soup mix packet.", "Add pulled rotisserie chicken.", "Add mushrooms.", "Add chopped spinach.", "Add sour cream and can of cream of mushroom soup.", "Mix a little over the top, making sure orzo stays covered by liquid.", "Bake a orn, drained", "1 jar of salsa, 12 oz", "1/4 c. water", "1 bag spanish rice", "Favorite toppings- lettuce, guac, hot sauce, etc."], "instructions": ["Add all of the ingredients except the rice to a crockpot and cook on low for 5-6 hours, or high for 3-4 hours.", "Remove the chicken, shred, and add back to the crockpot.", "Heat the rice according to the package.", "Layer the rice and chicken mixture to a bowl and add your favorite toppings. Enjoy!"], "no_directions_line": "", "notes": ["From on-screen recipe card at end of Home with Hart TikTok compilation."], "source_url": "https://www.tiktok.com/t/ZTyRg4qJt/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/21.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "tiktok-tj-french-onion-meatballs", "title": "Crockpot French Onion Meatballs (Trader Joe’s)", "category": "Dinner", "site": "homewithhart", "meta": {}, "family_note": "", "ingredients": ["2 T. Olive oil", "1 bag party sized meatballs (20 oz)", "1 serving French Onion soup (frozen)", "1 c. Beef broth", "1 T. Worcestershire", "2 tsps each garlic powder and onion powder", "1 tsp each salt and pepper", "Corn starch slurry (1 T. corn starch, 1 T. cold water mixed together)", "1 1/2-2 c. Swiss & gruyere cheese blend", "Optional Items: thinly sliced yellow onion, crispy fried onions, chopped fresh parsley for garnish"], "instructions": ["Add olive oil, (fresh onions if using,) French onion soup, meatballs, seasonings, beef broth and Worcestershire to a crockpot.", "Cook on low for 2.5-3 hours, or high for 1.5-2 hours.", "Add in the cornstarch slurry if you want the sauce to be thicker. Turn crockpot to high and let cook for 30 more minutes.", "Switch the crockpot to warm, layer on the cheese and cover with the lid until the cheese is melted (about 10 minutes).", "Top with parsley and crispy fried onions (optional but recommended!). Served over Creamy Parmesan Orzo."], "no_directions_line": "", "notes": ["From on-screen recipe : "25 min", "servings": "4 -6"}, "family_note": "", "ingredients": ["2 cups milk (I use whole milk)", "1 1/2 cups reduced sodium chicken or vegetable broth (or water)", "8 ounces elbow or mini shell pasta", "1/2 teaspoon salt", "10 ounces frozen broccoli (I use the steam-in-the-bag kind)", "1 cup shredded cheddar cheese (feel free to double this!)", "1 tablespoon unsalted butter", "1 tablespoon cream cheese", "1/4 teaspoon onion powder (optional)"], "instructions": ["Add the broth and milk to a large pot set over high heat. Bring just to a boil, then reduce to medium-high.", "Stir in the pasta and salt, and simmer for 10-12 minutes, stirring occasionally or until the pasta is just soft. (The liquid will not be totally absorbed and that is okay—it will be by the end of the process!)", "Meanwhile, steam the broccoli in the bag (or steam it on the stovetop if using fresh broccoli). Drain the broccoli and cut it up roughly with kitchen scissors.", "Turn the heat off and stir the cheese, broccoli. butter, cream cheese, and salt into the pasta mixture. Taste and season with additional salt as needed. Serve."], "no_directions_line": "", "notes": [], "source_url": "https://www.yummytoddlerfood.com/one-pot-broccoli-mac-and-cheese/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/26.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "pin-5GhnO2pPN", "title": "Parmesan Chicken Bake Recipe", "category": "Dinner", "site": "My Kitchen Escapades", "meta": {"prep_time": "10 min", "cook_time": "45 min", "total_time": "55 min", "servings": "6 servings"}, "family_note": "", "ingredients": ["6 boneless, skinless chicken breasts", "1 C light mayonnaise or greek yogurt (I have done 1/2 of each as well)", "1/2 c fresh parmesan cheese, plus more for the top", "1 1/2 tsp seasoned salt (Not regular table salt)", "1/2 tsp pepper", "1 tsp garlic powder"], "instructions": ["oven to 375 degrees and spray the inside of a 9×13 glass pan. Lay the chicken ins shouse", "meta": {}, "family_note": "", "ingredients": ["1 (20 oz) package refrigerated cheese tortellini", "1 lb ground Italian sausage, browned", "1 (24 oz) jar Latin Marinara", "1 cup chicken broth", "½ cup heavy cream", "1 small yellow onion, thinly sliced", "1 red bell pepper, sliced", "1 zucchini, chopped", "1 cup spinach (optional)", "2 cups shredded mozzarella", "½ cup grated Parmesan", "1 tsp Italian seasoning", "Fresh basil or parsley for garnish"], "instructions": ["Preheat oven to 375°F.", "In a greased 9x13 baking dish, combine tortellini, browned sausage, Latin Marinara, chicken broth, heavy cream, onion, bell pepper, zucchini, and Italian seasoning.", "Stir until everything is coated.", "Cover tightly with foil and bake for 35 minutes.", "Remove foil, stir in spinach, and top with mozzarella and Parmesan.", "Bake uncovered for 10–15 minutes, until the cheese is golden and bubbly.", "Let rest for 5 minutes before serving."], "no_directions_line": "", "notes": ["Tip: too much zucchini can make this soupy — leave zucchini out, or add 2–3 cups more mozzarella and cook uncovered another 10 min, or let cool longer.", "Optional add-ins mentioned: mushrooms, corn, fire-roasted tomatoes, kale instead of spinach, pepper jack cheese."], "source_url": "https://www.tiktok.com/t/ZTyRpAhPh/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/29.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-2", "title": "Trader Joe's Pesto Chicken Bake", "category": "Dinner", "site": "homewithhart", "meta": {}, "family_note": "", "ingredients": ["Trader Joe's pesto chicken", "Cherry tomatoes", "Mozzarella balls", "Salt and pepper", "Garlic Parmesan pasta (or quinoa or rice)", "Pine nuts for garnish (optional)", "Trader Joe's balsamic glaze (recommended)", "Olive oil", "Arugula (optional garnish)", "Parmesan cheese (optional garnish)"], "instructions": ["Oil a casserole dish.", "Layer in the pesto chicken.", "Top with cherry tomatoes ry": "Dinner", "site": "homewithhart", "meta": {"cook_time": "15–20 min bake"}, "family_note": "", "ingredients": ["1 stick (1/2 cup) unsalted butter", "2 cups heavy cream", "3-4 cloves garlic, minced", "1 1/2-2 cups freshly grated Parmesan cheese", "2 teaspoons Italian herb seasoning", "Salt and pepper to taste", "1 packed cup baby spinach, chopped", "2 packages Chicken ravioli", "1 1/2 cups mozzarella, shredded"], "instructions": ["Preheat the oven to 375°F.", "Start by adding the butter to an oven-safe pan. Let it melt over medium low heat before pouring in the heavy cream.", "Bring the butter and cream to a low simmer then add in the minced garlic.", "Slowly start to incorporate the parmesan cheese - gently whisking to avoid any clumps.", "Turn down the heat to low then add in the seasonings and chopped spinach.", "Let the sauce simmer for 2-3 more minutes until it's thickened to your liking. If it gets too thick add in another splash of heavy cream or milk.", "Remove from the heat and reserve 1/2 cup of the sauce.", "Nestle all of the ravioli into the sauce. If you're using two packages, you will need to layer some of the noodles on top of each other and that's ok.", "Use the reserved sauce to cover any of the exposed noodles before sprinkling on all of the cheese.", "Bake for 15-20 minutes, until the cheese is all golden brown. Serve and enjoy!"], "no_directions_line": "", "notes": ["From on-screen recipe card at end of Home with Hart TikTok compilation."], "source_url": "https://www.tiktok.com/t/ZTyRg4qJt/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/33.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "blog-mary-3", "title": "Whole30 Harvest Sheet Pan Dinner", "category": "Dinner", "site": "Mary's Whole Life", "meta": {"prep_time": "10 min", "cook_time": "30 min", "total_time": "40 min", "servings": "6 people"}, "family_note": "", "ingredients": ["1 pack Aidell's chicken apple sausage or sausage of choice, cut in n on the packaging.", "Serve with biscuit on top and enjoy!"], "no_directions_line": "", "notes": ["Caption notes: Recipe from slowcookermeals.com"], "source_url": "https://www.tiktok.com/t/ZTyRn1tkV/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/39.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-4", "title": "Crockpot Lasagna Soup", "category": "Soups", "site": "thehankshouse", "meta": {}, "family_note": "", "ingredients": ["1½–2 lbs ground beef or Italian sausage", "1 small yellow onion, diced", "4 cloves garlic, minced", "24 oz marinara sauce", "28 oz crushed or diced tomatoes", "3 tbsp tomato paste", "4 cups beef broth", "1 tbsp Worcestershire", "1 tbsp Italian seasoning", "1 tsp garlic powder", "1 tsp onion powder", "½ tsp basil", "½ tsp black pepper", "½ tsp salt", "10–12 lasagna noodles, broken up", "1 cup ricotta", "1 cup mozzarella", "½ cup Parmesan"], "instructions": ["Brown the beef and onion, drain, then add everything except the noodles to the crockpot.", "Cook LOW 5–6 hours or HIGH 2½–3½ hours.", "Add the broken uncooked noodles for the last 25–35 minutes on HIGH, checking them early so they don’t get mushy.", "Mix 1 cup ricotta + 1 cup mozzarella + ½ cup Parmesan and put a big spoonful in each bowl before ladling the hot soup over it, or dollop it right on top."], "no_directions_line": "", "notes": [], "source_url": "https://www.tiktok.com/t/ZTyRgbYfE/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/40.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "pin-4TidWdJCe", "title": "Easy Cheeseburger Soup Recipe", "category": "Soups", "site": "Insanely Good Recipes", "meta": {"prep_time": "30 min", "cook_time": "25 min", "total_time": "55 min", "servings": "8 servings"}, "family_note": "", "ingredients": ["1/2 pound ground beef", "4 tablespoons butter, divided", "3/4 cup carrots, diced", "3/4 cup celery, diced", "3/4 cup onion, diced", "1 teaspoon dried basil" .com/reel/Dde_ipNiMY7/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/45.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-23", "title": "Birthday Cake Funfetti Cookies", "category": "Desserts", "site": "hey.itsbel", "meta": {"servings": "about 30 cookies"}, "family_note": "", "ingredients": ["2 3/4 cups all-purpose flour (plus a couple tablespoons more up to 1/4 cup if sticky)", "1 1/2 tablespoons cornstarch", "1 teaspoon baking soda", "Pinch of salt", "1 cup unsalted butter (on-screen recipe; she says salted butter aloud)", "1 cup white sugar", "1/2 cup light brown sugar", "2 eggs, room temperature", "2 tsp vanilla (on-screen; spoken “measure with your heart”)", "Optional: about 1/4 teaspoon almond extract", "1 cup jimmies (long sprinkles)", "Buttercream: 1/2 cup soft butter", "2 cups icing/powdered sugar", "2 tablespoons heavy cream", "1/2 teaspoon vanilla", "Pinch of salt (buttercream, on-screen)", "Round sprinkles for topping"], "instructions": ["Mix dry ingredients: flour, cornstarch, baking soda, and pinch of salt.", "Cream 1 cup room-temperature butter with 1 cup white sugar and 1/2 cup light brown sugar for 3–4 minutes until fluffy.", "Add 2 room-temperature eggs; mix. Add vanilla (and optional almond extract).", "Fold in dry ingredients by hand until almost combined, then add 1 cup jimmies. If sticky, add a couple tablespoons more flour up to 1/4 cup.", "Form medium-sized balls (about 30 cookies). Keep ones not baking right away in the fridge.", "Bake at 350°F for about 10–11 minutes.", "Buttercream: whip 1/2 cup soft butter; slowly add 2 cups powdered sugar; add 2 tablespoons heavy cream and about 1/2 teaspoon vanilla; whip 2–3 minutes until fluffy.", "Pipe or spoon icing onto cooled cookies; add round sprinkles on top."], "no_directions_line": "", "notes": [], "source_url": "https://www.tiktok.com/t/ZTyRnAH94/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/46.jpg", "keep": null,  vibes)", "2 ¾ cups all-purpose flour (spooned & leveled)", "1 ½ tsp. baking powder", "3/4 tsp salt", "1/2 tsp baking soda", "1/2 cup red and green jimmies sprinkles (plus more as desired)", "~1/4 cup granulated sugar (for rolling and garnishing)"], "instructions": ["Preheat Oven: Preheat the oven to 350°F (177°C). Line two baking sheets with parchment paper and set aside.", "Cream Butter and Sugar: In a large mixing bowl, use a hand mixer or stand mixer fitted with the paddle attachment to cream together the butter and granulated sugar on medium speed for 2-3 minutes, or until light and fluffy. Start Timer", "Add Wet Ingredients: Beat in the egg, egg yolk, milk, and vanilla extract, mixing until combined and smooth. Scrape down the sides of the bowl as needed.", "Add Dry Ingredients: In a separate bowl, whisk together the flour, baking powder, salt, and baking soda. Gradually add the dry ingredients to the wet ingredients, mixing on low speed until a soft dough forms.", "Add Sprinkles: Fold in the red and green jimmies sprinkles until evenly distributed throughout the dough.", "Scoop and Roll: Scoop ~ 1 1/2 - 2 tablespoons (or make smaller 1 Tbsp. if desired) of dough per cookie and roll into balls. Roll each ball in granulated sugar before placing it on the prepared baking sheets, spacing cookies about 2 inches apart. (Optional to chill: you can chill the cookie dough prior to baking if desired. From 1 hour or up to 3 days covered in the fridge.. Allow to come to room temperature, then roll and bake as directed below.)", "Bake: Bake for 8-10 minutes, or until the edges are set and just barely golden. The centers should look slightly soft. Do not overbake. Start Timer", "Cool: Allow cookies to cool on the baking sheet for 3-5 minutes, then transfer to a wire rack to cool completely. Start Timer", "Enjoy: Sprinkle any remaining granulated sugar on top and garnish with more sprinkles for a festive look!"], "no_directions_line": "", "notes": ["Ingredients also appeared in the Instagram caption; full directions taken from the recipe page linked in the post."], "source_url": "https://krollskorner.com/recipes/desserts/cookies/christmas-sprinkle-sugar-cookies/", "pin_it": "", "instagram_url": "https://www.instagram.com/reel/DQ9TMekEQRB/", "placeholder": false, "img": "img/48.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-27", "title": "Protein Pumpkin Cookie Dough Bars", "category": "Desserts", "site": "Dayle Hoffman Kerns", "meta": {"servings": "8-12 servings"}, "family_note": "", "ingredients": ["1 cup blanched almond flour (creator noted adding an extra cup because the PB Fit mix was runny)", "1/2 cup vanilla protein powder (creator noted adding another 1/3 cup because it was runny)", "1 tsp pumpkin spice", "1 cup creamy peanut butter (or PB Fit for more protein less fat)", "1/2 cup organic pumpkin puree", "1/2 cup pure maple syrup", "1 tsp pure vanilla extract", "1/2 cup dark chocolate chips", "Topping: 1 cup chocolate chips + 1 tbsp coconut oil — melted"], "instructions": ["Add dry ingredients to a mixing bowl (almond flour / protein powder / pumpkin spice as listed in caption).", "Add creamy peanut butter (or PB Fit), organic pumpkin puree, pure maple syrup, and pure vanilla extract; mix until a dough forms. Creator notes adding extra almond flour and protein powder if the mixture is runny.", "Fold in dark chocolate chips.", "For the topping: melt 1 cup chocolate chips with 1 tbsp coconut oil and spread over the bars (caption; melting shown in reel)."], "no_directions_line": "", "notes": ["Ingredient amounts from Instagram caption (including creator’s noted adjustments).", "Assembly steps observed from the reel visuals (mix → press → melted chocolate topping).", "Recipe inspo credited to @sofreshnsogreeeeen in caption.", "Pumpkin puree can shown on camera (Farmer’s Market organic pumpkin puree)."], "source_url": "https://www.instagram.com/reel/Dcq8tHlNFHh/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/49.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "tiktok-protein-balls", "title": "Quick & Easy Protein Balls", "category": "Desserts", "site": "jocelynperkes", "meta": {}, "family_note": "", "ingredients": ["1 cup Rice Krispies", "2 cups oats", "1/2 cup honey", "3/4 cup peanut butter", "CSE brownie batter protein powder — 1 scoop (Clean Simple Eats brownie batter shown)", "1 cup mini peanut butter M&M’s"], "instructions": ["Add 2 cups oats to a mixing bowl.", "Add 1 cup Rice Krispies.", "Add 1 scoop CSE brownie batter protein powder.", "Add 3/4 cup peanut butter.", "Add 1/2 cup honey.", "Add 1 cup mini peanut butter M&M’s.", "Mix until combined.", "Scoop into balls and place in a container."], "no_directions_line": "", "notes": ["Amounts from on-screen text in the TikTok; assembly order follows the video."], "source_url": "https://www.tiktok.com/t/ZTyRt4D6e/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/50.jpg", "keep": null, "keep_label": "Original card / clipping"}, {"id": "social-24", "title": "Raspberry Peach Crisp", "category": "Desserts", "site": "Elizabeth Anne | Motherhood and Baking", "meta": {}, "family_note": "", "ingredients": ["Filling:", "4-5 fresh peaches", "6 ozs fresh raspberries", "1/2 cup sugar", "1 teaspoon cinnamon", "2 tablespoons corn starch", "1 tablespoon lemon juice (about 1/2 a lemon)", "Topping:", "1 cup rolled oats", "3/4 cup flour", "1 cup brown sugar", "1/2 cup cold butter", "1/2 tsp salt"], "instructions": ["Preheat oven to 350 degrees.", "Combine diced peaches and raspberries with sugar, lemon juice, cinnamon, and corn starch. Mix together and add to buttered baking dish.", "In a separate bowl, combine flour, brown sugar, oats, salt, and cold butter. Mix until the mixture resembles coarse crumbles.", "Add your topping evenly to your peaches/raspberries.", "Bake for 30 minutes at 350 degrees or until golden brown.", "Allow to rest 15-20 minutes before serving to let the filling set.", "Serve with vanilla ice cream and enjoy."], "no_directions_line": "", "notes": [], "source_url": "https://www.instagram.com/reel/DatwUmKpvGD/", "pin_it": "", "instagram_url": "", "placeholder": false, "img": "img/51.jpg", "keep": null, "keep_label": "Original card / clipping"}], "cats": ["Breakfast", "Breads & Baked", "Dinner", "Soups", "Appetizers", "Desserts"]}</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('data').textContent);
var R = DATA.recipes, CATS = DATA.cats, BYID = {};
R.forEach(function(r){ BYID[r.id] = r; });
var app = document.getElementById('app');
var state = { q:'', cat:'All', fav:false, scroll:0 };
var checks = {}; // per-recipe checked ingredient indexes (kept while app is open)
var FKEY = 'familyRecipes.favorites';

function loadFavs(){ try { return JSON.parse(localStorage.getItem(FKEY) || '[]'); } catch(e){ return []; } }
function saveFavs(f){ try { localStorage.setItem(FKEY, JSON.stringify(f)); } catch(e){} }
function isFav(id){ return loadFavs().indexOf(id) >= 0; }
function toggleFav(id){ var f = loadFavs(), i = f.indexOf(id); if(i>=0) f.splice(i,1); else f.push(id); saveFavs(f); return i < 0; }

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'"); }
function isUrl(s){ return /^https?:\/\//i.test(s||''); }
function isGroup(i){ i = i.trim(); return (i.slice(-1)===':' && i.length < 45) || i.toUpperCase().indexOf('FOR ')===0 || (i[0]==='[' && i.slice(-1)===']'); }
var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';

function matches(r){
  if (state.cat !== 'All' && r.category !== state.cat) return false;
  if (state.fav && !isFav(r.id)) return false;
  var q = norm(state.q).trim(); if (!q) return true;
  var hay = norm(r.title + ' \n ' + r.ingredients.join(' \n '));
  return q.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
}

function renderHome(){
  var chips = ['All'].concat(CATS).map(function(c){
    return '<button class="chip'+(state.cat===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  }).join('');
  app.innerHTML =
    '<header class="topbar"><h1>Family Recipes</h1></header>'+
    '<main class="wrap">'+
      '<div class="search"><input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Search recipes or ingredients" aria-label="Search recipes or ingredients"><button class="clear" id="qc" aria-label="Clear search">×</button></div>'+
      '<div class="chips" id="chips"><button class="chip fav'+(state.fav?' on':'')+'" id="favf">♥ Favorites</button>'+chips+'</div>'+
      '<div class="count" id="count"></div><div class="grid" id="grid"></div>'+
      '<div class="foot">'+R.length+' recipes</div>'+
    '</main>';
  var q = document.getElementById('q'), qc = document.getElementById('qc');
  q.value = state.q; qc.style.display = state.q ? 'block' : 'none';
  q.addEventListener('input', function(){ state.q = q.value; qc.style.display = q.value ? 'block':'none'; renderGrid(); });
  qc.addEventListener('click', function(){ state.q=''; q.value=''; qc.style.display='none'; renderGrid(); q.focus(); });
  document.getElementById('chips').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if (b.id === 'favf'){ state.fav = !state.fav; b.classList.toggle('on', state.fav); }
    else { state.cat = b.getAttribute('data-cat');
      Array.prototype.forEach.call(this.querySelectorAll('[data-cat]'), function(x){ x.classList.toggle('on', x===b); }); }
    renderGrid();
  });
  document.getElementById('grid').addEventListener('click', function(e){
    var h = e.target.closest('.heart'); if(!h) return;
    e.preventDefault(); e.stopPropagation();
    var on = toggleFav(h.getAttribute('data-id')); h.classList.toggle('on', on);
    h.setAttribute('aria-pressed', on);
    if (state.fav) renderGrid();
  });
  renderGrid();
  window.scrollTo(0, state.scroll);
}

function renderGrid(){
  var list = R.filter(matches);
  var g = document.getElementById('grid');
  document.getElementById('count').textContent = list.length + (list.length===1?' recipe':' recipes');
  if (!list.length){ g.innerHTML = '<div class="empty" style="grid-column:1/-1">'+(state.fav && !loadFavs().length ? 'No favorites yet. Tap the heart on a recipe to save it here.' : 'No recipes match.')+'</div>'; return; }
  g.innerHTML = list.map(function(r){
    var f = isFav(r.id);
    return '<a class="card" href="#/r/'+encodeURIComponent(r.id)+'">'+
      (r.img ? '<img loading="lazy" alt="" src="'+r.img+'">' : '<img alt="">')+
      '<button class="heart'+(f?' on':'')+'" data-id="'+esc(r.id)+'" aria-label="Favorite" aria-pressed="'+f+'">'+HEART+'</button>'+
      '<div class="t">'+esc(r.title)+'</div>'+
      (r.placeholder ? '<div class="ph">Saved video link</div>' : '')+
      '<div class="c">'+esc(r.category)+'</div></a>';
  }).join('');
}

// ---- wake lock
var wake = { want:false, lock:null };
var WAKE_OK = ('wakeLock' in navigator) && typeof navigator.wakeLock.request === 'function';
function requestWake(){
  if (!WAKE_OK || !wake.want || document.visibilityState !== 'visible') return;
  navigator.wakeLock.request('screen').then(function(l){
    wake.lock = l; l.addEventListener('release', function(){ wake.lock = null; });
  }).catch(function(err){ wake.want = false; var t = document.getElementById('wake'); if(t) t.checked = false; console.warn('Wake lock unavailable:', err && err.message); });
}
function releaseWake(){ if (wake.lock){ wake.lock.release().catch(function(){}); wake.lock = null; } }
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && wake.want && !wake.lock) requestWake(); });

function renderRecipe(id){
  var r = BYID[id];
  if (!r){ location.replace('#/'); return; }
  var f = isFav(r.id), h = '';
  var meta = [];
  if (r.meta.prep_time) meta.push('Prep ' + r.meta.prep_time);
  if (r.meta.cook_time) meta.push('Cook ' + r.meta.cook_time);
  if (r.meta.total_time) meta.push('Total ' + r.meta.total_time);
  if (r.meta.servings) meta.push('Serves ' + r.meta.servings);
  if (r.site) meta.push(r.site);

  h += '<header class="topbar"><div class="rbar"><button class="back" id="back" aria-label="Back">‹ Recipes</button><span class="sp"></span>'+
       '<button class="heart'+(f?' on':'')+'" id="rfav" aria-label="Favorite" aria-pressed="'+f+'">'+HEART+'</button></div></header>';
  h += '<main class="wrap">';
  if (r.img) h += '<img class="hero" alt="" src="'+r.img+'">';
  h += '<h1 class="rtitle">'+esc(r.title)+'</h1><div class="accent"></div>';
  if (meta.length && !r.placeholder) h += '<div class="meta">'+esc(meta.join('  ·  '))+'</div>';

  if (r.placeholder){
    if (isUrl(r.source_url)) h += '<a class="bigbtn" href="'+esc(r.source_url)+'" target="_blank" rel="noopener">Open the original video</a>';
    if (r.notes.length) h += '<h2 class="lbl">Notes</h2><ul class="notes">'+r.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul>';
    if (r.site) h += '<div class="creator">Creator: '+esc(r.site)+'</div>';
  } else {
    if (WAKE_OK) h += '<label class="wake"><span>Keep screen on</span><span class="sp"></span><span class="switch"><input type="checkbox" id="wake"'+(wake.want?' checked':'')+'><span></span></span></label>';
    if (r.family_note) h += '<h2 class="lbl">Family note</h2><div class="famnote">'+esc(r.family_note)+'</div>';
    var c = checks[r.id] || {};
    var items = r.ingredients.map(function(it, i){
      it = it.trim();
      if (isGroup(it)) return '</ul><div class="grp">'+esc(it.replace(/^\[|\]$/g,''))+'</div><ul class="ing">';
      return '<li data-i="'+i+'" role="checkbox" aria-checked="'+(!!c[i])+'"'+(c[i]?' class="done"':'')+'><span class="box"></span><span class="txt">'+esc(it)+'</span></li>';
    }).join('');
    h += '<h2 class="lbl">Ingredients<small id="icount"></small></h2><ul class="ing">'+items+'</ul>';
    h += '<h2 class="lbl">Directions</h2>';
    if (r.instructions.length){
      var n = 0, steps = r.instructions.map(function(s){
        s = s.trim();
        if (s[0]==='[' && s.slice(-1)===']') return '</ol><div class="grp">'+esc(s.slice(1,-1))+'</div><ol class="steps">';
        n++; return '<li><span class="n">'+n+'</span><span>'+esc(s)+'</span></li>';
      }).join('');
      h += '<ol class="steps">'+steps+'</ol>';
    } else if (r.no_directions_line){
      h += '<div class="nodir">'+esc(r.no_directions_line)+'</div>';
    }
    if (r.notes.length) h += '<h2 class="lbl">Notes</h2><ul class="notes">'+r.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul>';
    if (r.keep) h += '<h2 class="lbl">'+esc(r.keep_label)+'</h2><img class="keep" alt="'+esc(r.keep_label)+'" src="'+r.keep+'">';
  }
  var src = isUrl(r.source_url) ? '<a href="'+esc(r.source_url)+'" target="_blank" rel="noopener">'+esc(r.source_url)+'</a>' : esc(r.source_url);
  var extra = '';
  if (r.pin_it) extra += '<br>Pin: <a href="'+esc(r.pin_it)+'" target="_blank" rel="noopener">'+esc(r.pin_it)+'</a>';
  if (r.instagram_url) extra += '<br>IG: <a href="'+esc(r.instagram_url)+'" target="_blank" rel="noopener">'+esc(r.instagram_url)+'</a>';
  h += '<div class="src">Source: '+src+extra+'</div></main>';
  app.innerHTML = h;
  window.scrollTo(0,0);

  document.getElementById('back').addEventListener('click', function(){
    if (history.length > 1 && fromHome) history.back(); else location.hash = '#/';
  });
  document.getElementById('rfav').addEventListener('click', function(){
    var on = toggleFav(r.id); this.classList.toggle('on', on); this.setAttribute('aria-pressed', on);
  });
  var w = document.getElementById('wake');
  if (w) w.addEventListener('change', function(){ wake.want = w.checked; if (w.checked) requestWake(); else releaseWake(); });
  var ul = app.querySelectorAll('ul.ing');
  function upd(){ var tot = app.querySelectorAll('ul.ing li').length, d = app.querySelectorAll('ul.ing li.done').length;
    var ic = document.getElementById('icount'); if (ic) ic.textContent = d ? (d+' of '+tot+' checked') : ''; }
  Array.prototype.forEach.call(ul, function(u){ u.addEventListener('click', function(e){
    var li = e.target.closest('li'); if(!li) return;
    var i = li.getAttribute('data-i'), cc = checks[r.id] = checks[r.id] || {};
    cc[i] = !cc[i]; li.classList.toggle('done', cc[i]); li.setAttribute('aria-checked', cc[i]); upd();
  }); });
  upd();
}

var fromHome = false, lastRoute = null;
function route(){
  var h = location.hash || '#/';
  var m = h.match(/^#\/r\/(.+)$/);
  if (lastRoute === 'home') state.scroll = window.scrollY;
  if (m){ fromHome = (lastRoute === 'home'); renderRecipe(decodeURIComponent(m[1])); lastRoute = 'recipe'; }
  else { releaseWake(); renderHome(); lastRoute = 'home'; }
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', function(){ if (lastRoute === 'home') state.scroll = window.scrollY; }, {passive:true});
route();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW registration failed',e);});});}</script>
</body>
